<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>dolidob podcast short</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Sans:wght@500;600;700&display=block" rel="stylesheet" />
    <script src="timing.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --night: #0b1430; --gold: #fcd34d; --mint: #6ee7b7; --sky: #93c5fd; --pink: #f9a8d4; --violet: #c4b5fd;
        --display: "Bricolage Grotesque", "IBM Plex Sans", sans-serif; --body: "IBM Plex Sans", sans-serif;
      }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); color: #fff; font-family: var(--body); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background:
          radial-gradient(760px 560px at 50% 52%, #2563eb40, transparent 70%),
          radial-gradient(900px 700px at 85% 6%, #1d3a8a55, transparent 70%),
          radial-gradient(800px 700px at 12% 96%, #fcd34d1f, transparent 70%), var(--night); }
      .grid { position: absolute; inset: 0; opacity: 0.16;
        background-image: linear-gradient(#93c5fd22 1px, transparent 1px), linear-gradient(90deg, #93c5fd22 1px, transparent 1px); background-size: 60px 60px; }
      .abs { position: absolute; }
      .center { left: 0; width: 1080px; text-align: center; }
      .kicker { top: 230px; font-weight: 700; font-size: 30px; letter-spacing: 4px; text-transform: uppercase; color: var(--sky); }
      .title { top: 278px; padding: 0 90px; font-family: var(--display); font-weight: 800; font-size: 62px; line-height: 1.05; }
      .onair { top: 175px; left: 465px; width: 150px; padding: 6px 0; border-radius: 999px; background: #ff5a5a; color: #fff; font-weight: 700; font-size: 22px; letter-spacing: 2px; text-align: center; }
      .card { position: absolute; left: 150px; top: 420px; width: 780px; height: 210px; z-index: 3; border-radius: 32px; background: #16224fee; border: 2px solid #ffffff22; padding: 28px 40px; opacity: 0; text-align: center; }
      .card .l { font-size: 34px; font-weight: 600; color: #c9d6f5; }
      .card .v { font-family: var(--display); font-weight: 800; font-size: 100px; line-height: 1.1; margin-top: 12px; }
      .card .v.long { font-size: 68px; margin-top: 26px; }
      .sky { color: var(--sky); } .violet { color: var(--violet); } .pink { color: var(--pink); } .gold { color: var(--gold); } .mint { color: var(--mint); }
      .who { position: absolute; top: 640px; width: 447px; height: 800px; transform-origin: 50% 100%; }
      .who img { position: absolute; left: 0; top: 0; width: 447px; height: 800px; }
      .who .open, .who .pose { opacity: 0; }
      .floor { position: absolute; left: 0; top: 1380px; width: 1080px; height: 120px; background: radial-gradient(520px 60px at 50% 40%, #00000066, transparent 70%); }
            .tag { position: absolute; top: 1395px; font-size: 34px !important; text-align: center; font-family: var(--display); font-weight: 800; font-size: 44px; }
      .sub { position: absolute; left: 70px; top: 1450px; width: 940px; height: 210px; z-index: 4; padding: 20px 36px; border-radius: 28px; background: #0b1430e6; border: 2px solid #ffffff26;
        display: flex; flex-direction: column; justify-content: center; text-align: center; font-weight: 600; line-height: 1.24; opacity: 0; }
      .sub b { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: 2px; display: block; margin-bottom: 6px; }
      .foot { top: 1680px; font-size: 24px; font-weight: 500; color: #8fa4d8; }
      .brand { top: 1730px; left: 340px; width: 400px; padding: 14px 0; border-radius: 999px; background: var(--gold); color: var(--night); font-family: var(--display); font-weight: 800; font-size: 44px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="55.6" data-width="1080" data-height="1920">
      <audio id="voice" src="assets/voice.mp3" data-start="0" data-duration="55.6" data-volume="1"></audio>
      <div class="grid"></div>
      <div class="abs center kicker">The Dolidob Paycheck Podcast</div>
      <div class="abs center title" id="title">Texas vs California on $75,000</div>
      <div class="abs onair">● ON AIR</div>

      <!-- Dob and Doli: full-body characters made by the channel owner with Gemini, keyed from a green
           background. Every pose is the same 614x1100 frame, so poses line up without offsets. -->
      <div class="floor"></div>
      <div class="who" id="dob" style="left:40px"></div>
      <div class="who" id="doli" style="left:593px"></div>
      <div class="tag" style="left:40px; width:447px; color:#93c5fd">Dob</div>
      <div class="tag" style="left:593px; width:447px; color:#fcd34d">Doli</div>

      <div id="cards"></div>
      <div id="subs"></div>
      <div class="abs center foot">Estimates only, not tax advice. 2026 rules.</div>
      <div class="abs brand">dolidob.com</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const T = window.TIMING || { total: 45, lines: [] };
      const q = (s) => document.querySelector(s);
      if (T.title) q("#title").textContent = T.title.replace(/ \(2026\)$/, "");
      const POSES = {
        dob: ["armscrossed", "point", "idea", "stressed", "confused", "facepalm", "tax", "celebrate", "think"],
        doli: ["pocket", "point", "idea", "shrug", "phone"],
      };
      Object.entries(POSES).forEach(([who, poses]) => {
        const box = q(`#${who}`);
        const add = (id, file, cls) => { const im = document.createElement("img"); im.id = id; im.className = cls; im.src = `assets/cast/${file}.png`; im.alt = ""; box.appendChild(im); };
        add(`${who}Closed`, `${who}-closed`, "closed");
        add(`${who}Open`, `${who}-open`, "open");
        poses.forEach((p) => add(`${who}-${p}`, `${who}-${p}`, "pose"));
      });
      const tl = gsap.timeline({ paused: true });
      const name = { dob: "Dob", doli: "Doli" };
      const color = { dob: "#93c5fd", doli: "#fcd34d" };
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

      // One subtitle per line, shown from its start until the next line starts. Long lines get a smaller font.
      T.lines.forEach((l, i) => {
        const el = document.createElement("div");
        el.className = "sub";
        const size = l.text.length > 120 ? 34 : l.text.length > 85 ? 38 : 44;
        el.innerHTML = `<b style="color:${color[l.speaker]}">${name[l.speaker]}</b><span style="font-size:${size}px">${esc(l.text)}</span>`;
        q("#subs").appendChild(el);
        const until = i + 1 < T.lines.length ? T.lines[i + 1].start : T.total;
        tl.set(el, { opacity: 0 }, 0);
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2 }, l.start);
        tl.set(el, { opacity: 0 }, until);
      });

      // Number cards stay up until the next card.
      const withCard = T.lines.filter((l) => l.card);
      withCard.forEach((l, i) => {
        const el = document.createElement("div");
        el.className = "card";
        const long = l.card.value.length > 9 ? " long" : "";
        el.innerHTML = `<div class="l">${esc(l.card.label)}</div><div class="v ${l.card.color}${long}">${esc(l.card.value)}</div>`;
        q("#cards").appendChild(el);
        const until = i + 1 < withCard.length ? withCard[i + 1].start : T.total;
        tl.set(el, { opacity: 0 }, 0);
        tl.fromTo(el, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, l.start);
        tl.set(el, { opacity: 0 }, until);
      });

      // The speaker is fully visible and bounces once; the listener stays in full colour, only a little faded.
      tl.set(["#dob", "#doli"], { opacity: 0.85 }, 0);
      tl.set(["#dobOpen", "#doliOpen"], { opacity: 0 }, 0);
      T.lines.forEach((l) => {
        const who = `#${l.speaker}`;
        const other = l.speaker === "dob" ? "#doli" : "#dob";
        tl.to(who, { opacity: 1, duration: 0.15 }, l.start);
        tl.to(other, { opacity: 0.85, duration: 0.15 }, l.start);
        tl.fromTo(who, { y: 0 }, { y: -8, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.out" }, l.start);
        // Lip sync: the mouth is open only while the voice is loud (measured from the audio in make_dialogue.mjs).
        (l.mouth || []).forEach(([a, b]) => {
          tl.set(`${who}Open`, { opacity: 1 }, a);
          tl.set(`${who}Open`, { opacity: 0 }, b);
        });
      });
      // Reactions: while one speaks, the listener can switch to an expression image (react), and both get
      // an end pose after the last line. The talking pair is hidden while a pose is shown.
      const showPose = (who, pose, from, until) => {
        const id = `#${who}-${pose}`;
        if (!document.querySelector(id)) return;
        tl.set([`#${who}Closed`, `#${who}Open`], { opacity: 0 }, from);
        tl.fromTo(id, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, from);
        tl.set(id, { opacity: 0 }, until);
        tl.set(`#${who}Closed`, { opacity: 1 }, until);
      };
      T.lines.forEach((l, i) => {
        const until = i + 1 < T.lines.length ? T.lines[i + 1].start : T.total;
        Object.entries(l.react || {}).forEach(([who, pose]) => {
          if (who === l.speaker) return;
          const isLast = i === T.lines.length - 1 && T.end && T.end[who];
          showPose(who, pose, l.start + 0.15, isLast ? l.end - 0.6 : until);
        });
      });
      if (T.end && T.lines.length) {
        const last = T.lines[T.lines.length - 1];
        Object.entries(T.end).forEach(([who, pose]) => showPose(who, pose, who === last.speaker ? last.end + 0.1 : last.end - 0.6, T.total + 1));
      }
      tl.to("#root", { opacity: 1, duration: 0.01 }, Math.max(0, T.total - 0.01));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
