name: Podcast episode

# One full episode, no manual steps: dialogue from dolidob.com's open data, Gemini voices and the 8 animated
# scenes in podcast/scenes (Grok clips, no lip sync). Started by n8n ("dolidob - Podcast Episodes"), which
# downloads the artifact, asks for approval on Telegram and uploads to YouTube as private.
# Secret: GEMINI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Label so the caller can find this run"
        required: true
        type: string
      state_a:
        description: "First state, e.g. Texas"
        required: true
        type: string
      state_b:
        description: "Second state, e.g. California"
        required: true
        type: string
      salary:
        description: "Salary in the open data, e.g. 75000"
        required: true
        type: string

run-name: "episode ${{ inputs.run_label }}"

permissions:
  contents: read

concurrency:
  group: podcast-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install "kokoro>=0.9.4" soundfile pillow numpy six

      - name: Test the script generator against the first episode
        run: sh tests/test_make_episode.sh

      - name: Write the episode script
        run: python scripts/make_episode.py "${{ inputs.state_a }}" "${{ inputs.state_b }}" "${{ inputs.salary }}"

      - name: Voices (Gemini, Kokoro fallback) and timing
        working-directory: podcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_PROVIDER: gemini
        run: |
          node ../scripts/make_dialogue.mjs

      - name: Compose the scenes, voices, cards and subtitles
        working-directory: podcast
        run: |
          rm -rf scenes_synced  # the Grok scene clips as they are, no lip sync
          python ../scripts/compose_scenes.py
          ffprobe -v error -show_entries stream=codec_type,width,height:format=duration -of default=nw=1 out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: podcast/out/video.mp4
          retention-days: 7
