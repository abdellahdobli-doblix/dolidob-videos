name: Render promo

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Label so the caller can find this run (e.g. a state slug + timestamp)"
        required: true
        type: string

run-name: "promo ${{ inputs.run_label }}"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Build narration
        working-directory: promo
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: node ../scripts/make_voice.mjs

      - name: Prepare browser
        run: npx --yes hyperframes browser ensure

      - name: Lint and check
        working-directory: promo
        run: |
          npx --yes hyperframes lint
          npx --yes hyperframes check || echo "check reported warnings"

      - name: Render 1080x1920
        working-directory: promo
        run: |
          mkdir -p out
          npx --yes hyperframes render --quality high --fps 30 --output out/video.mp4

      - name: Probe result
        working-directory: promo
        run: ffprobe -v error -show_entries stream=codec_type,width,height,duration -of default=nw=1 out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: promo/out/video.mp4
          retention-days: 3
